# 覆蓋 Elastic Beanstalk 自動生成的 upload_limit.conf
# 避免與主 nginx.conf 的 client_max_body_size 產生重複衝突
#
# EB PHP platform 會自動在 /etc/nginx/conf.d/upload_limit.conf 寫入
# client_max_body_size，但 http block 中已有此指令，導致 duplicate directive 錯誤。
# 將此檔案放於 .platform/nginx/conf.d/ 可在部署時覆蓋自動生成的版本。
client_max_body_size 64M;
